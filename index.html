<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Veteran Eagles Browser</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="browser">

    <!-- TOP BAR -->
    <header id="toolbar">

      <div id="brand">
        <div class="eagle">🦅</div>

        <div class="brand-text">
          <div class="brand-name">VETERAN EAGLES</div>
          <div class="brand-subtitle">PATRIOT BROWSER</div>
        </div>
      </div>

      <div id="navButtons">

        <button
          id="back"
          class="nav-btn"
          title="Back">
          ‹
        </button>

        <button
          id="forward"
          class="nav-btn"
          title="Forward">
          ›
        </button>

        <button
          id="reload"
          class="nav-btn"
          title="Reload">
          ↻
        </button>

        <button
          id="home"
          class="nav-btn"
          title="Home">
          ⌂
        </button>

      </div>

      <div id="addressContainer">

        <span id="lock">★</span>

        <input
          id="address"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search or enter a URL">

        <button
          id="go"
          title="Go">
          →
        </button>

      </div>

      <div id="rightButtons">

        <button
          id="newTab"
          class="nav-btn"
          title="New tab">
          +
        </button>

        <button
          id="fullscreen"
          class="nav-btn"
          title="Fullscreen">
          ⛶
        </button>

      </div>

    </header>

    <!-- PATRIOTIC ACCENT -->
    <div id="flagStripe">
      <div class="red"></div>
      <div class="white"></div>
      <div class="blue"></div>
    </div>

    <!-- TABS -->
    <div id="tabs">

      <div
        id="tab"
        class="tab active">

        <span class="tab-icon">🦅</span>

        <span
          id="tabTitle"
          class="tab-title">
          Veteran Eagles
        </span>

        <button
          id="closeTab"
          class="tab-close">
          ×
        </button>

      </div>

    </div>

    <!-- LOADING -->
    <div id="loadingBar"></div>

    <!-- PAGE -->
    <main id="pageContainer">

      <!-- HOME -->
      <div id="homePage">

        <div class="stars"></div>

        <div class="home-content">

          <div class="eagle-large">
            🦅
          </div>

          <div class="brand-large">
            VETERAN <span>EAGLES</span>
          </div>

          <div class="motto">
            FREEDOM • HONOR • SERVICE
          </div>

          <div class="divider">
            <span></span>
            ★
            <span></span>
          </div>

          <div class="home-search">

            <input
              id="homeSearch"
              type="text"
              placeholder="Search or enter a URL">

            <button id="homeGo">
              →
            </button>

          </div>

          <div class="quick-links">

            <button
              onclick="navigate('https://www.google.com')">
              GOOGLE
            </button>

            <button
              onclick="navigate('https://www.youtube.com')">
              YOUTUBE
            </button>

            <button
              onclick="navigate('https://github.com')">
              GITHUB
            </button>

          </div>

        </div>

        <div class="bottom-banner">
          <span>★</span>
          VETERAN EAGLES
          <span>★</span>
        </div>

      </div>

      <!-- WEBSITE -->
      <iframe
        id="page"
        allow="
          autoplay;
          fullscreen;
          gamepad;
          picture-in-picture
        "
        allowfullscreen>
      </iframe>

      <!-- ERROR -->
      <div id="errorPage">

        <div class="error-box">

          <div class="error-icon">
            🦅
          </div>

          <h2>
            PAGE COULD NOT LOAD
          </h2>

          <p id="errorText">
            Something prevented the page from loading.
          </p>

          <button id="retry">
            TRY AGAIN
          </button>

        </div>

      </div>

    </main>

  </div>

  <script src="browser.js"></script>

</body>

</html>
